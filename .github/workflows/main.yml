name: CI Pipeline

# 1. When should this run? Every time you push to the 'main' branch!
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. What should it do?
jobs:
  test:
    # We ask GitHub for a fresh, empty Linux server
    runs-on: ubuntu-latest

    steps:
    # Step A: Download your code onto the server
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step B: Install Node.js v24 on the server
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    # Step C: Install your packages
    - name: Install Dependencies
      run: npm ci

    # Step D: Run your tests!
    - name: Run Jest Tests
      run: npm test